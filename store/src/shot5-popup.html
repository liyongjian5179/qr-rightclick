<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<script src="vendor/qrcode.min.js"></script><script src="common.js"></script>
<style>
  .pop {
    position: absolute; right: 12px; top: 50px; width: 332px;
    border-radius: 10px; overflow: hidden; background: #fff;
    box-shadow: 0 18px 50px rgba(34,51,68,.25), 0 0 0 1px var(--line);
  }
  .pop iframe { display: block; width: 332px; height: 330px; border: 0; }
</style>
</head><body>
<div class="slide">
  <div class="copy">
    <div class="brand"><img src="icon128.png" alt="">QR Right-Click</div>
    <h1>Clean and<br><em>out of the way.</em></h1>
    <p>No extra buttons on your pages. Click the toolbar icon for a quick how-to, a language switch, and a way to support the project.</p>
  </div>
  <div class="stage">
    <div class="browser">
      <div class="chrome-bar"><i></i><i></i><i></i><div class="url">example.com</div><img class="ext hl" src="icon128.png" alt="" style="outline-offset:2px;border-radius:6px"></div>
      <div class="page">
        <div class="skeleton" style="width:55%;height:22px;margin-bottom:22px"></div>
        <div class="skeleton"></div><div class="skeleton" style="width:90%"></div><div class="skeleton" style="width:70%"></div>
        <div style="height:24px"></div>
        <div class="skeleton" style="width:40%"></div><div class="skeleton" style="width:60%"></div>
      </div>
      <div class="pop"><iframe src="POPUP_URL"></iframe></div>
    </div>
  </div>
</div>
</body></html>
