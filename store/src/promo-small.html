<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  body { width: 440px; height: 280px; background: var(--ink); color: #fff; }
  .wrap { height: 100%; display: flex; align-items: center; gap: 22px; padding: 0 34px; position: relative; overflow: hidden; }
  .wrap img { width: 112px; height: 112px; border-radius: 24px; flex: none; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -0.3px; }
  p { margin: 0; color: #c8d6e3; font-size: 16px; line-height: 1.45; }
  p b { color: var(--lime); }
  .glow { position: absolute; right: -60px; bottom: -80px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(187,255,102,.22), transparent 70%); }
</style>
</head><body>
<div class="wrap">
  <div class="glow"></div>
  <img src="icon128.png" alt="">
  <div>
    <h1>QR Right-Click</h1>
    <p>Right-click any QR code<br>to <b>open it instantly</b>.<br>100% local decoding.</p>
  </div>
</div>
</body></html>
